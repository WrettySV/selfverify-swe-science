[project]
name = "selfverify-swe-science"
version = "0.1.0"
description = "Cross-candidate verification and own-test refinement for scientific software repair"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = []
report = ["reportlab==5.0.1", "pypdf==6.19.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
selfverify = ["prompts/*.md"]
