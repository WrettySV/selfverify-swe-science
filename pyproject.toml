[project]
name = "selfverify-swe-science"
version = "0.1.0"
description = "Single-agent self-verification (metamorphic tests) for SWE-bench Science via Pier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
selfverify = ["prompts/*.md"]
